name: macOS Apple Silicon
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: brew install cmake qt opencv
      - name: Build, test and package arm64 app
        run: ./scripts/build-macos.sh
      - name: Upload downloadable app
        uses: actions/upload-artifact@v7
        with:
          name: Afterimage-macos-arm64
          path: dist/Afterimage-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30
